[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qgdevs"
version = "0.2.0"
description = "Quantum Gravity Discovery and Experimental Verification System — scientific core"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.1", "scipy>=1.14", "h5py>=3.10", "pyarrow>=15", "pyyaml>=6",
  "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6", "httpx>=0.27", "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = ["pytest>=8"]
llm = ["anthropic>=1.0"]

[tool.setuptools.packages.find]
include = ["qgdevs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running verification (convergence, Monte Carlo)"]

[tool.setuptools.package-data]
qgdevs = ["release_notes.json"]
