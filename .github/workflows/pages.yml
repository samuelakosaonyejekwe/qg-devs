# Publishes the installable web app to GitHub Pages: https://samuelakosaonyejekwe.github.io/qg-devs/
# The app calls the always-on QG-DEVS API server (CORS-restricted to this origin); offline it uses its local engine.
name: pages
on:
  push:
    branches: [main]
    paths: ["web/**", "qgdevs/release_notes.json", "qgdevs/equations.py", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Build
        working-directory: web
        env:
          VITE_BASE: /qg-devs/
          VITE_API_BASE: ${{ vars.API_BASE_URL || 'https://63-186-135-183.sslip.io' }}
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
          cp dist/index.html dist/404.html   # SPA fallback for deep links
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with: { path: web/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v5
