# Continuous delivery. GitHub is used only to build and ship; production runs on independent hosts
# (Fly.io primary, optional Render secondary) and the static web app is mirrored to Cloudflare Pages.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/qg-devs:latest,ghcr.io/${{ github.repository_owner }}/qg-devs:${{ github.sha }}
  fly:
    needs: image
    if: ${{ vars.DEPLOY_FLY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
      - run: flyctl deploy --remote-only --strategy rolling
        env: { FLY_API_TOKEN: "${{ secrets.FLY_API_TOKEN }}" }
      - name: Post-deploy verification
        run: |
          for i in $(seq 1 20); do curl -fsS "https://${{ vars.FLY_APP || 'qg-devs' }}.fly.dev/api/health" && exit 0; sleep 15; done; exit 1
  static-mirror:
    if: ${{ vars.DEPLOY_CLOUDFLARE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - run: cd web && npm ci && npm run build
        env: { VITE_API_BASE: "${{ vars.API_BASE_URL }}" }
      - run: npx wrangler@3 pages deploy web/dist --project-name=qg-devs --branch=main
        env:
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
