<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>QG-DEVS</title>
    <meta name="description" content="QG-DEVS — Quantum Gravity Discovery and Experimental Verification System: computational predictions, virtual laboratory, model discrimination and evidence management." />
    <meta name="theme-color" content="#1b1f4b" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="QG-DEVS" />
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      try { var t = localStorage.getItem('qg.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"><noscript>QG-DEVS requires JavaScript.</noscript></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
