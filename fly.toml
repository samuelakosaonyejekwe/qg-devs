# Primary cloud deployment (Fly.io). A Fly volume attaches to a single machine, so the API and the
# worker/scheduler run together ("all" mode) on that machine; Fly restarts it automatically, and the
# scheduler keeps ingesting data, verifying and backing up while every developer machine is off.
app = "qg-devs"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  QGDEVS_HOME = "/data"
  WEB_CONCURRENCY = "2"
  # the app is reachable only through Fly's proxy: trust its X-Forwarded-For so per-visitor job limits, rate
  # limits and job-cancel ownership see the real client address instead of one shared proxy address
  FORWARDED_ALLOW_IPS = "*"

[processes]
  app = "qgdevs-start all"

[mounts]
  source = "qgdevs_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
